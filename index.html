<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>уведомление</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
    }

    .picture {
      display: block;
      width: min(70vw, 320px);
      height: auto;
      margin: 0 auto 24px;
      border-radius: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 14vw, 180px);
      font-weight: 900;
      line-height: 1.05;
      overflow-wrap: break-word;
    }

    p {
      margin: 24px 0 0;
      font-size: clamp(12px, 3vw, 18px);
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <img
      class="picture"
      src="https://i.pinimg.com/1200x/92/b4/3e/92b43e162b3462fd33aa05f949eeae6e.jpg"
      alt=""
    >
    <h1>пофиксила комбухи</h1>
    <p>запросить сайт у блеймь</p>
  </main>
</body>
</html>
