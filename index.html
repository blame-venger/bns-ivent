</style></head><body><main><h1 class="page-title">лабудилабудай</h1><div class="side-labels"><span>1 · ЛЕВАЯ</span><span>2 · ПРАВАЯ</span></div><div class="board-wrap"><div id="tiles" class="tiles"><svg id="route" aria-hidden="true"><polyline id="route-line"/></svg></div><div id="blocked" class="blocked" hidden><div class="blocked-card"><p>Нет подходящей комбинации</p><button id="undo-blocked" class="secondary">Отменить</button></div></div></div><div class="actions"><button id="undo" class="secondary">Отменить</button><button id="reset" class="secondary">Сбросить всё</button></div><p id="notice" class="notice" aria-live="polite"></p><section class="results"><div class="section-title"><h2>Возможные комбинации</h2><span id="result-count">21</span></div><p class="hint">Листай карточки вбок. Шаг 1 — внизу, шаг 14 — наверху.</p><div id="matches" tabindex="0" role="region" aria-label="Карточки возможных комбинаций, листайте горизонтально"></div></section><footer>1 — левая плитка &nbsp;·&nbsp; 2 — правая плитка</footer></main><script>
const combinations = `111 212 112 212 11
111 222 122 212 12
112 112 111 122 11
112 112 112 121 11
112 112 112 212 12
112 121 111 112 11
112 121 112 212 11
112 121 211 122 21
112 122 111 211 21
112 211 211 122 21
112 212 112 121 11
211 121 222 112 22
211 122 211 211 22
211 122 211 221 11
211 122 211 221 22
212 112 111 112 22
212 112 111 122 22
212 121 111 212 22
212 121 111 212 11
212 121 222 212 21
212 122 211 221 22`.split('\n').map((line,index)=>({id:index+1,values:line.replaceAll(' ','').split('').map(Number)}));
const filterMatches = state => combinations.filter(c=>state.every((v,i)=>v===0||c.values[i]===v));


const $=id=>document.getElementById(id);
let state=Array(14).fill(0),history=[],pathIndex=0;
try{const saved=JSON.parse(localStorage.getItem('glass-path-v1'));if(Array.isArray(saved)&&saved.length===14&&saved.every(v=>[0,1,2].includes(v)))state=saved;}catch{}
const tiles=state.map((_,i)=>{
 const row=document.createElement('div');row.className='bridge-row';
 const label=document.createElement('span');label.className='step-number';label.textContent=i+1;row.append(label);
 const buttons=[1,2].map(side=>{
  const button=document.createElement('button');button.className='tile';
  button.innerHTML=`<strong>${side}</strong><span class="direction">${side===1?'левая':'правая'}</span>`;
  button.addEventListener('click',()=>{if(!filterMatches(state).length)return;history.push([...state]);state[i]=state[i]===side?0:side;pathIndex=0;render();});
  row.append(button);return button;
 });$('tiles').append(row);return buttons;
});
function drawRoute(){
 const matches=filterMatches(state),path=state.some(Boolean)?matches[pathIndex]:null;
 if(!path){$('route-line').setAttribute('points','');return;}
 const bounds=$('tiles').getBoundingClientRect();
 const points=path.values.map((side,i)=>{const rect=tiles[i][side-1].getBoundingClientRect();return `${rect.left-bounds.left+rect.width/2},${rect.top-bounds.top+rect.height/2}`;});
 $('route-line').setAttribute('points',points.join(' '));
}
function render(){
 const matches=filterMatches(state),filled=state.filter(Boolean).length;
 if(pathIndex>=matches.length)pathIndex=0;
 const path=filled?matches[pathIndex]:null;
 tiles.forEach((buttons,i)=>buttons.forEach((button,index)=>{
  const side=index+1,selected=state[i]===side,onPath=!!path&&path.values[i]===side;
  button.dataset.value=selected?side:0;button.classList.toggle('on-path',onPath&&!selected);
  button.classList.toggle('dimmed',!!path&&!onPath);
  button.setAttribute('aria-pressed',String(selected));
  button.setAttribute('aria-label',`Шаг ${i+1}, ${side===1?'левая, 1':'правая, 2'}${selected?', выбрана':onPath?', возможный путь':''}`);
 }));
 $('result-count').textContent=matches.length;$('undo').disabled=!history.length;$('reset').disabled=!filled;
 const blocked=matches.length===0;$('blocked').hidden=!blocked;$('tiles').classList.toggle('is-blocked',blocked);$('tiles').inert=blocked;if(blocked)requestAnimationFrame(()=>$('undo-blocked').focus({preventScroll:true}));
 
 $('notice').className='notice'+(!matches.length?' error':'');
 $('notice').textContent=!matches.length?'Совпадений нет. Проверь выбор или отмени последний шаг.':!filled?'Начни с шага 1 внизу или отметь любую известную сторону.':matches.length===1?'Осталась одна комбинация. Её путь показан на плитках.':`Показан один из ${matches.length} возможных путей. Пунктир — предположение по оставшимся комбинациям.`;
 $('matches').innerHTML=matches.length?matches.map((c,index)=>`<article class="path-card" aria-label="Комбинация ${c.id}, ${index+1} из ${matches.length}"><div class="card-title"><h3>Комбинация ${String(c.id).padStart(2,'0')}</h3><span>${index+1} / ${matches.length}</span></div><div class="mini-head"><span>1 · ЛЕВАЯ</span><span>2 · ПРАВАЯ</span></div><div class="mini-bridge">${c.values.map((v,i)=>`<div class="mini-row"><span class="mini-number">${i+1}</span>${[1,2].map(side=>`<span class="mini-tile ${v===side?'route-tile':''} ${state[i]===side?'confirmed-tile':''}" aria-label="Шаг ${i+1}, ${side===1?'левая':'правая'}${v===side?', путь':''}${state[i]===side?', выбрана':''}">${v===side?side:''}</span>`).join('')}</div>`).join('')}</div></article>`).join(''):'<p class="empty">Нет подходящих комбинаций.</p>';
 $('matches').scrollLeft=0;
 try{localStorage.setItem('glass-path-v1',JSON.stringify(state));}catch{}
 requestAnimationFrame(drawRoute);
}
$('undo').addEventListener('click',()=>{if(history.length){state=history.pop();pathIndex=0;render();}});
$('reset').addEventListener('click',()=>{if(state.some(Boolean)){history.push([...state]);state=Array(14).fill(0);pathIndex=0;render();}});
$('undo-blocked').addEventListener('click',()=>{if(history.length){state=history.pop();}else{state=Array(14).fill(0);}pathIndex=0;render();});
new ResizeObserver(drawRoute).observe($('tiles'));
render();

</script></body></html>
